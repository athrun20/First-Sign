name: pillar_ai
description: "First Sign — AI property companion. AI-powered home exterior assessments."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_native_splash: ^2.4.6
  google_fonts: ^8.2.0
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  http: ^1.6.0
  image_picker: ^1.1.2
  path_provider: ^2.1.6
  pdf: ^3.11.1
  printing: ^5.13.0
  shared_preferences: ^2.5.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

# Generate launcher icons:
#   dart run flutter_launcher_icons
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/branding/firstsign_logo.png"
  adaptive_icon_background: "#0B1B2B"
  adaptive_icon_foreground: "assets/branding/firstsign_logo.png"
  min_sdk_android: 21
  remove_alpha_ios: true
  web:
    generate: true
    image_path: "assets/branding/firstsign_logo.png"
    background_color: "#0B1B2B"
    theme_color: "#0B1B2B"
  windows:
    generate: true
    image_path: "assets/branding/firstsign_logo.png"
    icon_size: 256
  macos:
    generate: true
    image_path: "assets/branding/firstsign_logo.png"

# Native launch splash:
#   dart run flutter_native_splash:create
flutter_native_splash:
  color: "#0B1B2B"
  image: assets/branding/firstsign_logo.png
  android: true
  ios: true
  web: false
  fullscreen: true
  android_12:
    color: "#0B1B2B"
    image: assets/branding/firstsign_logo.png
    icon_background_color: "#0B1B2B"

flutter:
  uses-material-design: true
  assets:
    - assets/icon/
    - assets/branding/
    - assets/calibration/
    - assets/calibration/healthy_multi_angle/
    - assets/calibration/severe_roof_damage/
    - assets/calibration/gutter_overflow/
    - assets/calibration/foundation_concern/
    - assets/calibration/peeling_paint/
    - assets/calibration/cracked_siding/
    - assets/calibration/weak_single_photo/
    - assets/calibration/aging_roof_granules/
    # Field fixture pack (A1) — see assets/calibration/README.md
    - assets/calibration/healthy_multi/
    - assets/calibration/paint_clear/
    - assets/calibration/drainage_grade/
    - assets/calibration/limited_dark/
    - assets/calibration/mixed_ambiguous/
